<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sin conexión · Baking Hub</title>
        <meta name="description" content="Baking Hub no tiene conexión en este momento." />
        <style>
            :root {
                --bg: #f3ece4;
                --panel: #fffaf7;
                --text: #3c2f2a;
                --muted: #79665e;
                --primary: #dca17d;
                --primary-strong: #c7785a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: radial-gradient(circle at top, #f8f2eb 0%, var(--bg) 42%, #e6d7ca 100%);
                color: var(--text);
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }
            .card {
                width: min(540px, calc(100% - 2rem));
                background: rgba(255, 255, 255, 0.72);
                border: 1px solid rgba(108, 84, 73, 0.12);
                border-radius: 24px;
                box-shadow: 0 18px 44px rgba(92, 71, 60, 0.12);
                padding: 2rem;
                text-align: center;
            }
            h1 {
                margin: 0 0 0.75rem;
                font-size: clamp(2rem, 4vw, 2.8rem);
            }
            p {
                margin: 0;
                color: var(--muted);
                line-height: 1.6;
            }
            .badge {
                display: inline-block;
                padding: 0.35rem 0.8rem;
                border-radius: 999px;
                background: rgba(220, 161, 125, 0.18);
                color: var(--primary-strong);
                font-weight: 700;
                margin-bottom: 1rem;
            }
            a {
                display: inline-block;
                margin-top: 1.5rem;
                padding: 0.8rem 1.2rem;
                border-radius: 999px;
                background: linear-gradient(135deg, var(--primary), var(--primary-strong));
                color: #3c2f2a;
                text-decoration: none;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <div class="badge">Offline</div>
            <h1>Sin conexión</h1>
            <p>
                Baking Hub está temporalmente sin internet. Puedes seguir revisando el catálogo y los elementos que ya
                cargaste antes.
            </p>
            <a href="/">Volver a la tienda</a>
        </main>
    </body>
</html>
