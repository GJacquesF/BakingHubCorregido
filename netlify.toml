   [build]
      base = "baking-hub-front"
      command = "npm run build"
      publish = "dist"

   [[headers]]
      for = "/sw.js"
      [headers.values]
         Cache-Control = "no-cache, no-store, must-revalidate"
         Service-Worker-Allowed = "/"
         Content-Type = "application/javascript"

   [[headers]]
      for = "/offline.html"
      [headers.values]
         Cache-Control = "no-cache, no-store, must-revalidate"